/**:
    ros__parameters:
      app_name: "YourPSDK"
      app_id: "YourID"
      app_key: "YourAppKey"
      app_license: "YourAppLicense"
      developer_account: "YourDeveloperAccount"
      baudrate: "921600"

      num_of_initialization_retries: 10


      tf_frame_prefix: "dji_psdk"
      imu_frame: "psdk_imu_link"
      body_frame: "psdk_body_link"
      home_point_frame: "psdk_home_point_link"
      horbody_frame: "psdk_horbody_link"
      map_frame: "psdk_map_enu"
      gimbal_base_frame: "psdk_gimbal_base_link"
      gimbal_frame: "psdk_gimbal_link"
      camera_frame: "psdk_camera_link"
      image_frame: "psdk_image_link"

      perception_camera_frame: "psdk_perception_camera_link"

      publish_transforms: true

      camera: "psdk_ros2/main_camera"
      main_camera_width: 1080
      main_camera_height: 600
      main_camera_jpeg_quality: 70
      image_time_offset_ms: 0
      location: "granso"
      sim: false
      default_altitude_value: -1000.0
      file_path: "/logs/media/"

      # Mandatory modules to be initialized. Mark with a true those which you
      # consider mandatory for your application, false otherwise. Be aware that
      # some modules might have inter-dependencies. Non mandatory modules will
      # still be initialized but if case of failure, the node will continue to run.
      mandatory_modules:
        telemetry: true
        flight_control: true
        camera: false
        gimbal: false
        liveview: false
        hms: false
        perception: false
        widget: true
        coord: true

      data_frequency: # Options are: 1, 5, 10, 50, 100, 200, 400 Hz
        imu: 100
        attitude: 100
        acceleration: 50
        velocity: 50
        angular_velocity: 100
        position: 50
        altitude: 50
        gps_fused_position: 10
        gps_data: 5
        rtk_data: 5
        magnetometer: 50
        rc_channels_data: 1
        gimbal_data: 1
        flight_status: 1
        battery_level: 1
        control_information: 1
        esc_data_frequency: 1
